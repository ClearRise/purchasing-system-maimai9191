name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            # Secrets pasted with trailing newlines break cd and pm2 (take first line only).
            trim() { printf '%s' "$1" | tr -d '\r' | head -n1; }
            DEPLOY_PATH="$(trim "${{ secrets.DEPLOY_PATH }}")"
            PM2_APP="$(trim "${{ secrets.PM2_APP }}")"
            PUBLIC_URL="$(trim "${{ secrets.PUBLIC_URL }}")"

            if [ -z "$DEPLOY_PATH" ] || [ -z "$PM2_APP" ] || [ -z "$PUBLIC_URL" ]; then
              echo "::error::DEPLOY_PATH, PM2_APP, and PUBLIC_URL must be non-empty"
              exit 1
            fi

            echo "=== Deploy ==="
            printf 'Path: %s\n' "$DEPLOY_PATH"
            printf 'URL:  %s\n' "$PUBLIC_URL"
            node -v
            npm -v

            cd "$DEPLOY_PATH"
            REPO_ROOT="$(pwd)"
            echo ">>> repo root: $REPO_ROOT"
            echo ">>> git pull"
            git pull origin main

            export VITE_BACKEND_URL="$PUBLIC_URL"
            export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=1536}"

            echo ">>> frontend: npm install"
            npm install --prefix frontend
            echo ">>> frontend: npm run build"
            npm run build --prefix frontend
            test -f frontend/dist/index.html

            echo ">>> copy frontend to backend/public"
            rm -rf backend/public
            mkdir -p backend/public
            cp -r frontend/dist/. backend/public/
            test -f backend/public/index.html

            echo ">>> backend: npm install"
            npm install --prefix backend
            echo ">>> backend: npm run build"
            npm run build --prefix backend
            test -f backend/dist/index.js || {
              echo "::error::backend/dist/index.js missing after build"
              exit 1
            }

            echo ">>> pm2 ($PM2_APP)"
            BACKEND_DIR="$REPO_ROOT/backend"
            if [ ! -d "$BACKEND_DIR" ]; then
              echo "::error::backend directory not found at $BACKEND_DIR"
              ls -la "$REPO_ROOT"
              exit 1
            fi
            cd "$BACKEND_DIR"
            echo ">>> pm2 cwd: $(pwd)"

            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "::error::pm2 not found in PATH. Install on the VPS: npm install -g pm2"
              exit 1
            fi
            echo ">>> pm2 binary: $(command -v pm2)"

            if pm2 describe "$PM2_APP" > /dev/null 2>&1; then
              echo ">>> pm2 restart existing app"
              pm2 restart "$PM2_APP" --update-env
            else
              echo ">>> pm2 start new app"
              pm2 start dist/index.js --name "$PM2_APP" --cwd "$BACKEND_DIR"
            fi
            pm2 save
            pm2 describe "$PM2_APP"
            echo "=== Deploy finished ==="